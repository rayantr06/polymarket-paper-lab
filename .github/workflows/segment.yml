name: Session du laboratoire
on:
  workflow_call:
    inputs:
      number:
        type: number
        required: true
    outputs:
      finished:
        value: ${{ jobs.collect.outputs.finished }}
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    outputs:
      finished: ${{ steps.state.outputs.finished }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Tests de causalité et de reprise
        run: node --test test/*.test.mjs
      - name: Restaurer la dernière mémoire de cette campagne
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: checkpoint
          key: paper-specialistes-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}-final
          restore-keys: paper-specialistes-v1-
      - name: Vérifier la mémoire avant démarrage
        env:
          SEGMENT: ${{ inputs.number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ ! -f checkpoint/pilot.sqlite ]; then
            if [ "$SEGMENT" != "1" ] || [ "$ATTEMPT" != "1" ]; then
              echo 'Checkpoint absent : arrêt, sans nouvelle fenêtre.' >&2
              exit 1
            fi
            if [ -n "$(git ls-remote --heads origin results)" ]; then
              echo 'Un bilan existe déjà : refus de réinitialiser sans sauvegarde.' >&2
              exit 1
            fi
          fi
      - name: Inventaire initial et premières lectures
        if: inputs.number == 1
        run: node src/run.mjs --init --minutes 2
      - name: Sauvegarder le démarrage
        if: inputs.number == 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: checkpoint
          key: paper-specialistes-v1-${{ github.run_id }}-${{ github.run_attempt }}-boot
      - name: Publier le premier bilan
        if: inputs.number == 1
        run: node src/publish-report.mjs
      - name: Continuer le test virtuel sans signer de transaction
        run: node src/run.mjs --minutes ${{ inputs.number == 1 && '143' || '145' }}
      - name: Sauvegarder la mémoire même après une erreur récupérable
        if: always() && hashFiles('checkpoint/pilot.sqlite') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: checkpoint
          key: paper-specialistes-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}-final
      - name: Publier le bilan de cette session
        if: always() && hashFiles('checkpoint/reports/bilan.json') != ''
        run: |
          node src/publish-report.mjs
          cat checkpoint/reports/bilan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lire la fin de fenêtre
        id: state
        if: success()
        run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('checkpoint/reports/bilan.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'finished='+(Date.now()>=r.manifest.drainEnd)+'\n');"
      - name: Préparer le journal final ou le diagnostic d'échec
        if: steps.state.outputs.finished == 'true' || failure()
        run: |
          if [ -f checkpoint/pilot.sqlite ]; then
            gzip -c checkpoint/pilot.sqlite > checkpoint/pilot.sqlite.gz
          fi
      - name: Export final facultatif sans achat de stockage
        if: steps.state.outputs.finished == 'true' || failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: papier-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}
          path: |
            checkpoint/pilot.sqlite.gz
            checkpoint/reports/
            policy.json
          retention-days: 2
          compression-level: 0
