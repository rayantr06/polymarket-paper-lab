name: Session indépendante AAA
on:
  workflow_call:
    inputs:
      number:
        type: number
        required: true
    outputs:
      finished:
        value: ${{ jobs.observe.outputs.finished }}
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    outputs:
      finished: ${{ steps.state.outputs.finished }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Restaurer seulement la mémoire de cette observation
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: aaa-checkpoint
          key: aaa-source-20261110-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}-final
          restore-keys: aaa-source-20261110-v1-
      - name: Interdire les doublons et les réinitialisations
        env:
          SEGMENT: ${{ inputs.number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ ! -f aaa-checkpoint/observer.sqlite ]; then
            if [ "$SEGMENT" != "1" ] || [ "$ATTEMPT" != "1" ]; then
              echo 'Mémoire AAA absente, refus de créer une nouvelle fenêtre.' >&2
              exit 1
            fi
            if [ -n "$(git ls-remote --heads origin aaa-source-results)" ]; then
              echo 'Cette observation existe déjà, arrêt sans doublon.' >&2
              exit 1
            fi
          fi
      - name: Première lecture bornée de la source et des carnets
        if: inputs.number == 1
        run: node aaa/run.mjs --init --once
      - name: Sauvegarder le démarrage indépendant
        if: inputs.number == 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: aaa-checkpoint
          key: aaa-source-20261110-v1-${{ github.run_id }}-${{ github.run_attempt }}-boot
      - name: Publier la première preuve AAA
        if: inputs.number == 1
        run: node aaa/publish.mjs
      - name: Observer sans ordre réel ni modification du pilote de copie
        run: node aaa/run.mjs --minutes 220
      - name: Sauvegarder la mémoire de l'observateur
        if: always() && hashFiles('aaa-checkpoint/observer.sqlite') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: aaa-checkpoint
          key: aaa-source-20261110-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}-final
      - name: Publier seulement le bilan indépendant AAA
        if: always() && hashFiles('aaa-checkpoint/reports/bilan.json') != ''
        run: |
          node aaa/publish.mjs
          cat aaa-checkpoint/reports/bilan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lire la fin de la fenêtre fixe
        id: state
        if: success()
        run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('aaa-checkpoint/reports/bilan.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'finished='+(Boolean(r.finished)||Date.now()>=r.manifest.end)+'\n');"
      - name: Préparer le journal final facultatif
        if: steps.state.outputs.finished == 'true' || failure()
        run: |
          if [ -f aaa-checkpoint/observer.sqlite ]; then
            gzip -c aaa-checkpoint/observer.sqlite > aaa-checkpoint/observer.sqlite.gz
          fi
      - name: Export facultatif sans achat de stockage
        if: steps.state.outputs.finished == 'true' || failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aaa-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}
          path: |
            aaa-checkpoint/observer.sqlite.gz
            aaa-checkpoint/reports/
            aaa/policy.json
            aaa/seed.json
          retention-days: 2
          compression-level: 0
